# frozen_string_literal: true

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= Rails.root.join("db/development.sqlite3") %>

test:
  <<: *default
  # Full suite + demo Puma in the same container can briefly contend on SQLite.
  # Give writers longer to wait, and use WAL so readers don't block writers.
  database: <%= Rails.root.join("db/test.sqlite3") %>
  timeout: 15000
  pragmas:
    journal_mode: wal
    busy_timeout: 15000

production:
  <<: *default
  database: <%= Rails.root.join("db/production.sqlite3") %>
