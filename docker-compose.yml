services:
  nquery:
    build: .
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: development_secret_key_base_for_local_only
      NQUERY_SECRET_KEY_BASE: development_secret_key_base_for_local_only
    command: bin/dev

volumes:
  bundle_cache:
